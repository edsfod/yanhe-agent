<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yanhe Agent 登录</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --card: #fff;
        --text: #18181b;
        --muted: #71717a;
        --line: #e4e4e7;
        --field: #fff;
        --accent: #18181b;
        --on-accent: #fff;
        --soft: #f4f4f5;
        --error: #dc2626;
        --ok: #16a34a;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --card: #18181b;
          --text: #fafafa;
          --muted: #a1a1aa;
          --line: #3f3f46;
          --field: #27272a;
          --accent: #fafafa;
          --on-accent: #18181b;
          --soft: #27272a;
          --error: #f87171;
          --ok: #22c55e;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px 16px; background: var(--bg); color: var(--text); }
      .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; box-shadow: 0 1px 3px #0000000d; }
      h1 { margin: 0 0 20px; font-size: 18px; font-weight: 600; text-align: center; }
      form, .step { display: flex; flex-direction: column; gap: 12px; }
      [hidden] { display: none !important; }
      .field { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); }
      .field:focus-within { outline: 2px solid var(--muted); outline-offset: 1px; }
      .field input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; }
      .field img { height: 28px; border-radius: 4px; }
      .field svg { flex: none; width: 16px; height: 16px; color: var(--muted); }
      .eye { border: 0; background: none; padding: 4px; color: var(--muted); cursor: pointer; }
      .switch { display: flex; align-items: center; gap: 8px; width: fit-content; margin-top: 4px; color: var(--muted); font-size: 14px; cursor: pointer; }
      .switch input { width: 16px; height: 16px; accent-color: var(--accent); }
      button.main, button.second { height: 40px; border-radius: 10px; font: inherit; font-weight: 500; cursor: pointer; }
      button.main { margin-top: 8px; border: 0; background: var(--accent); color: var(--on-accent); }
      button.second { border: 1px solid var(--line); background: var(--soft); color: inherit; }
      button:disabled, input:disabled { opacity: 0.6; cursor: default; }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12px; white-space: nowrap; }
      .row p { margin: 0; overflow: hidden; text-overflow: ellipsis; }
      .link { border: 0; background: none; padding: 0; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; font-variant-numeric: tabular-nums; }
      .link:disabled { color: var(--muted); text-decoration: none; }
      .code { height: 56px; text-align: center; letter-spacing: 0.6em; padding-left: 0.6em; font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); color: inherit; outline: 0; }
      .code:focus { border-color: var(--muted); }
      .error { color: var(--error); }
      .done { align-items: center; text-align: center; gap: 8px; padding: 12px 0; }
      .done svg { width: 40px; height: 40px; color: var(--ok); }
      .done p { margin: 0; }
      .small { font-size: 12px; color: var(--muted); }
      #notice { min-height: 40px; max-width: 560px; margin: 0; text-align: center; font-size: 14px; color: var(--muted); text-wrap: balance; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>统一身份认证</h1>
      <p id="loading" class="small" style="text-align: center">正在连接本地服务…</p>

      <form id="credentials" hidden>
        <label class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
          <input id="username" placeholder="请输入学号" autocomplete="username" aria-label="学号" />
        </label>
        <label class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" aria-label="密码" />
          <button id="eye" class="eye" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
        </label>
        <label id="captcha-field" class="field" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 5 6v6c0 4 3 7.5 7 9 4-1.5 7-5 7-9V6z" /><path d="m9 12 2 2 4-4" /></svg>
          <input id="captcha" placeholder="请输入图中字符" autocomplete="off" aria-label="图形验证码" />
          <img id="captcha-image" alt="图形验证码" />
        </label>
        <label class="switch"><input id="remember" type="checkbox" checked /> 记住账户</label>
        <button id="login" class="main" type="submit">登录</button>
      </form>

      <div id="verify" class="step" hidden>
        <div class="row">
          <p id="sent"></p>
          <button id="resend" class="link" type="button">重新发送</button>
        </div>
        <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码" aria-label="短信验证码" />
        <button id="cancel" class="second" type="button">取消</button>
      </div>

      <div id="done" class="step done" role="status" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10" /><path d="m8 12 3 3 5-6" /></svg>
        <p>登录成功</p>
        <p class="small">可以关闭此页面了</p>
      </div>
    </main>
    <p id="notice" role="status"></p>

    <script>
      // The page follows the server's sign-in state, pushed over /api/events after every change, and posts the
      // user's actions to /api/<action> with the token from the address's fragment.
      const token = location.hash.slice(1)
      const $ = (id) => document.getElementById(id)
      let state = null
      let busy = null
      let codeError = ''
      let stopped = false
      let focusCode = false  // set when the code input should take the keyboard once it is enabled

      // Sends one step to the local service; resolves to '' when it went through, or else to what the page should say.
      async function post(action, payload = {}) {
        busy = action
        render()
        let reply
        try {
          reply = await fetch('/api/' + action, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: { 'X-Token': token, 'Content-Type': 'application/json' },
          })
        } catch {
          reply = null
        }
        let said = ''
        if (!reply) said = '无法连接本地服务'
        else if (!reply.ok) said = (await reply.json().then((answer) => answer.error, () => '')) || `请求失败（HTTP ${reply.status}）`
        busy = null
        render()
        return said
      }

      function notify(text) {
        $('notice').textContent = text
      }

      function wait() {
        return state ? Math.max(0, Math.ceil(state.resend_at - Date.now() / 1000)) : 0
      }

      function render() {
        $('loading').hidden = Boolean(state)
        if (stopped && state?.stage !== 'done') notify('本地服务已停止，请重新运行命令')
        if (!state) return
        for (const stage of ['credentials', 'verify', 'done']) $(stage).hidden = state.stage !== stage

        const locked = busy === 'login'
        for (const id of ['username', 'password', 'captcha', 'remember', 'login']) $(id).disabled = locked
        $('login').textContent = locked ? '登录中…' : '登录'
        $('password').placeholder =
          state.saved && $('username').value === state.username ? '使用已保存的密码' : '请输入密码'
        if (state.captcha && $('captcha-field').hidden) setTimeout(() => $('captcha').focus(), 0)
        $('captcha-field').hidden = !state.captcha
        if (state.captcha && $('captcha-image').src !== state.captcha) $('captcha-image').src = state.captcha

        const sending = state.sending || busy === 'resend'
        const verifying = busy === 'verify'
        const phone = state.phone || '绑定手机'
        $('sent').textContent =
          codeError ||
          (sending ? `正在发送验证码至 ${phone}` : state.resend_at ? `验证码已发送至 ${phone}` : '验证码未发送，请重新发送')
        $('sent').className = codeError ? 'error' : ''
        const seconds = wait()
        $('resend').disabled = sending || verifying || seconds > 0
        $('resend').textContent = sending ? '发送中…' : seconds ? `${seconds} 秒后重新发送` : '重新发送'
        $('code').disabled = sending || verifying
        if (focusCode && state.stage === 'verify' && !$('code').disabled) {
          focusCode = false
          $('code').focus()
        }
        $('cancel').disabled = verifying
        $('cancel').textContent = verifying ? '验证中…' : '取消'
      }

      let shownStage = null
      function update(next) {
        const fresh = !state
        state = next
        if (fresh) $('username').value = state.username
        if (state.stage !== shownStage) {
          shownStage = state.stage
          notify('')
          focusCode = state.stage === 'verify'
        }
        if (state.message) notify(state.message)
        render()
      }

      $('eye').onclick = () => {
        const visible = $('password').type === 'password'
        $('password').type = visible ? 'text' : 'password'
        $('eye').textContent = visible ? '隐藏' : '显示'
        $('eye').setAttribute('aria-pressed', String(visible))
        $('eye').setAttribute('aria-label', visible ? '隐藏密码' : '显示密码')
      }
      $('username').oninput = () => (notify(''), render())
      $('password').oninput = () => notify('')
      $('credentials').onsubmit = async (event) => {
        event.preventDefault()
        notify('')
        notify(
          await post('login', {
            username: $('username').value,
            password: $('password').value,
            captcha: $('captcha-field').hidden ? '' : $('captcha').value,
            remember: $('remember').checked,
          }),
        )
      }
      $('code').oninput = async () => {
        $('code').value = $('code').value.replace(/\D/g, '').slice(0, 6)
        if ($('code').value.length < 6) return
        const failure = await post('verify', { code: $('code').value })
        if (failure) {
          $('code').value = ''
          codeError = failure
          focusCode = true
          render()
          setTimeout(() => ((codeError = ''), render()), 1800)
        }
      }
      $('resend').onclick = async () => {
        codeError = await post('resend')
        render()
      }
      $('cancel').onclick = () => {
        $('code').value = ''
        codeError = ''
        post('cancel')
      }
      setInterval(() => state?.stage === 'verify' && render(), 1000)  // the resend countdown

      // The service pushes the sign-in's state; once it ends the stream, it has stopped, usually after signing in.
      const feed = new EventSource('/api/events?token=' + encodeURIComponent(token))
      feed.addEventListener('message', ({ data }) => update(JSON.parse(data)))
      feed.addEventListener('error', () => {
        feed.close()
        stopped = true
        render()
      })
    </script>
  </body>
</html>
